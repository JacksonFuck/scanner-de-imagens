[alembic]
script_location = src/scanner_api/db/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url é injetado dinamicamente via env.py (lê SCANNER_DATA_DIR)
sqlalchemy.url = sqlite+aiosqlite:///./scanner.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
