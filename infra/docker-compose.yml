services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: scanner-api:local
    environment:
      SCANNER_DATA_DIR: /data
      SCANNER_VAPID_PUBLIC_KEY: ${SCANNER_VAPID_PUBLIC_KEY}
      SCANNER_VAPID_PRIVATE_KEY: ${SCANNER_VAPID_PRIVATE_KEY}
      SCANNER_VAPID_EMAIL: ${SCANNER_VAPID_EMAIL}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    image: scanner-web:local
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN:-localhost}
      NODE_ENV: production
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/scanner.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
