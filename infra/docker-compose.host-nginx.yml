services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: scanner-api:local
    environment:
      SCANNER_DATA_DIR: /data
      SCANNER_VAPID_PUBLIC_KEY: ${SCANNER_VAPID_PUBLIC_KEY}
      SCANNER_VAPID_PRIVATE_KEY: ${SCANNER_VAPID_PRIVATE_KEY}
      SCANNER_VAPID_EMAIL: ${SCANNER_VAPID_EMAIL}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    image: scanner-web:local
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
