name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/api/pyproject.toml

      - name: Install scanner core + api (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ./apps/api[dev]

      - name: Lint (ruff)
        run: |
          python -m ruff check src/ tests/ apps/api/src apps/api/tests

      - name: Tests (pytest)
        working-directory: apps/api
        run: |
          python -m pytest -q

  frontend-build:
    name: Frontend (next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
